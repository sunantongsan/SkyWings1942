name: GALAXY 1942 Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify bundled HD artwork
        shell: bash
        run: |
          set -euo pipefail
          file app/src/main/res/drawable-nodpi/galaxy1942_ui_atlas.webp
          file app/src/main/res/drawable-nodpi/galaxy1942_buildings.webp
          test $(stat -c%s app/src/main/res/drawable-nodpi/galaxy1942_ui_atlas.webp) -gt 200000
          test $(stat -c%s app/src/main/res/drawable-nodpi/galaxy1942_buildings.webp) -gt 150000

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK and AAB
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy1942-v3.1-RTS-HD-Playable
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
