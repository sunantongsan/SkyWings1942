name: GALAXY 1942 Godot Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Assemble original 3D assets and Godot project
        run: python3 tools/assemble_godot.py --output game

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot and export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build native Google rewarded ads plugin
        run: |
          gradle -p android_ads assembleRelease --no-daemon
          cp android_ads/build/outputs/aar/galaxy-ads-release.aar game/addons/galaxy_ads/GalaxyAds.aar
          mkdir -p game/android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d game/android/build
          touch game/android/.gdignore
          echo "${GODOT_VERSION}.stable" > game/android/.build_version

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$JAVA_HOME/bin/java"

      - name: Import GLBs and render building icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri ffmpeg
          godot --headless --path game --editor --import --quit
          timeout 90s xvfb-run -a godot --audio-driver Dummy --path game --script res://tests/render_icons.gd
          godot --headless --path game --editor --import --quit

      - name: Record and encode real-game tutorial videos
        run: |
          set -o pipefail
          timeout 600s xvfb-run -a godot --audio-driver Dummy --path game --script res://tests/record_lessons.gd 2>&1 | tee lesson-checks.log
          grep -q REAL_GAME_TUTORIAL_RECORDING_PASSED lesson-checks.log
          if grep -q 'SCRIPT ERROR' lesson-checks.log; then exit 1; fi
          python3 tools/encode_lessons.py game
          godot --headless --path game --editor --import --quit

      - name: Verify gameplay and capture real Godot scene
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a godot --audio-driver Dummy --path game --script res://tests/capture.gd 2>&1 | tee visual-checks.log
          grep -q GALAXY_VISUAL_AND_GAMEPLAY_CHECKS_PASSED visual-checks.log
          grep -q DIRECT_ENTRY_AND_OFFLINE_VIDEO_LESSONS_PASSED visual-checks.log
          grep -q REPEAT_TRAINING_DIRECT_50_MINUTE_REWARDS_COIN_ADS_AND_RESTART_PASSED visual-checks.log
          if grep -q 'SCRIPT ERROR' visual-checks.log; then exit 1; fi

      - name: Verify offline campaign rewards and progression
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a godot --audio-driver Dummy --path game --script res://tests/campaign.gd 2>&1 | tee campaign-checks.log
          grep -q OFFLINE_50_BASES_DIFFICULTY_REWARDS_REPLAY_SAVE_MIGRATION_PASSED campaign-checks.log
          if grep -q 'SCRIPT ERROR' campaign-checks.log; then exit 1; fi

      - name: Verify specialized defenses and upgraded walls
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a godot --audio-driver Dummy --path game --script res://tests/defenses.gd 2>&1 | tee defense-checks.log
          grep -q V23_DIFFICULTY_150_PERCENT_TYPED_WEAPONS_IMPACT_WALLS_SAVE_PASSED defense-checks.log
          if grep -q 'SCRIPT ERROR' defense-checks.log; then exit 1; fi

      - name: Upload scene review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GALAXY1942-Homeworld-Review
          path: |
            game/build/review/*.png
            visual-checks.log
            lesson-checks.log
            campaign-checks.log
            defense-checks.log
            game/assets/tutorial/*.ogv
            game/assets/models/manifest.json

      - name: Reuse Android test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: galaxy1942-android-test-keystore-v1

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$HOME/.android/debug.keystore"

      - name: Export debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p game/build
          godot --verbose --headless --path game --export-debug "Android" build/GALAXY1942-Godot-debug.apk

      - name: Verify APK landscape manifest
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt"
          "$AAPT" dump xmltree game/build/GALAXY1942-Godot-debug.apk AndroidManifest.xml > manifest.txt
          grep -q "com.google.android.gms.ads.APPLICATION_ID" manifest.txt
          grep -q "org.godotengine.plugin.v2.GalaxyAds" manifest.txt
          grep -E "screenOrientation.*0x0|screenOrientation.*landscape|screenOrientation.*0x6" manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GALAXY1942-Godot-Android
          path: game/build/GALAXY1942-Godot-debug.apk
          if-no-files-found: error

      - name: Package editable Godot project
        run: |
          cd game
          zip -qr ../GALAXY1942-Godot-Source.zip . -x '.godot/*' 'build/*' 'android/build/.gradle/*' 'android/build/build/*' 'android/build/.cxx/*'

      - name: Upload editable project and individual models
        uses: actions/upload-artifact@v4
        with:
          name: GALAXY1942-Godot-Source
          path: GALAXY1942-Godot-Source.zip
