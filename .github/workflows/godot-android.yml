name: GALAXY 1942 Godot Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Godot project from source
        run: |
          rm -rf game
          mkdir -p game/scripts game/scenes game/assets
          cp godot_src/project.godot game/project.godot
          cp godot_src/export_presets.cfg game/export_presets.cfg
          cp godot_src/main.gd game/scripts/main.gd
          cp godot_src/main.tscn game/scenes/main.tscn
          python3 tools/prepare_godot.py
          echo "Buildings: $(find game/assets/buildings -type f | wc -l)"
          echo "Units: $(find game/assets/units -type f | wc -l)"
          echo "Maps: $(find game/assets/maps -type f | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot and export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$JAVA_HOME/bin/java"

      - name: Validate Godot project and assets
        run: |
          godot --headless --path game --import
          godot --headless --path game --editor --quit
          echo "Buildings: $(find game/assets/buildings -type f | wc -l)"
          echo "Units: $(find game/assets/units -type f | wc -l)"
          echo "Maps: $(find game/assets/maps -type f | wc -l)"

      - name: Export debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p game/build
          godot --headless --path game --export-debug "Android" game/build/GALAXY1942-Godot-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GALAXY1942-Godot-Android
          path: game/build/GALAXY1942-Godot-debug.apk
          if-no-files-found: error
