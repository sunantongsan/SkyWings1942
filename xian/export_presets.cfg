[preset.0]
name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/credits/*.txt,assets/credits/*.json,assets/realistic/*.json"
exclude_filter="build/*,tests/*"
export_path="build/Xian-of-Clans.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
gradle_build/use_gradle_build=true
gradle_build/min_sdk="24"
gradle_build/compress_native_libraries=true
architectures/armeabi-v7a=false
